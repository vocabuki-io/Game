<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#efe6cf" />
  <title>3つの鍵</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ロビー -->
  <section id="lobby" class="screen">
    <h1>3つの鍵</h1>
    <p class="tag">1対1・鍵ピッキングの読み合い。合言葉を共有して2人で対戦。</p>
    <label class="field">
      <span>あいことば（部屋コード）</span>
      <input id="room-input" type="text" inputmode="latin" placeholder="例: yabai123" autocomplete="off" />
    </label>
    <button id="join-btn" class="primary">入室する</button>
    <p class="hint">同じあいことばを相手に伝えて、両方から入室。<br>先に入った人が<b>囚人</b>、次が<b>看守</b>。</p>
    <div class="rules">
      <b>ルール</b>：囚人は毎ターン扉を1つ<b>ピッキング</b>（鍵+1）。看守は<b>監視</b>か<b>修理</b>を1つ。<br>
      看守の監視が囚人の扉と一致すると<b>現行犯</b>＝その鍵は0に。どれかの鍵を3まで開ければ<b>脱獄勝ち</b>、看守は20ターン凌げば勝ち。
    </div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen hidden">
    <header id="hud">
      <span id="role-badge" class="badge">-</span>
      <span id="turn-badge" class="turn">T -/-</span>
    </header>

    <div id="locks" class="locks"></div>
    <div id="hint-line" class="hint-line"></div>
    <div id="controls" class="controls"></div>
    <div id="log" class="log"></div>
  </section>

  <!-- コミック演出 -->
  <div id="burst" class="hidden"><div class="burst-star"><span id="burst-text"></span></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
